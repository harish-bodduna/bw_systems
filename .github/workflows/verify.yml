# sap-bw-migrator-workflow: 5
# Committed into the GENERATED repository as .github/workflows/verify.yml
#
# CI for a sha already merged onto `dev`. Sandbox checks during development
# live in the tool (Review). Opening a PR does not start this job, and neither
# does the merge itself. The Continuous Integration page fires it.
#
# It needs nothing but the repository: schemas and fixtures were written into
# waves/<wave>.json at commit time precisely because a GitHub-hosted runner
# cannot reach the control plane.

name: Verify generated code

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact commit merged onto dev'
        required: true
      wave:
        description: 'Manifest path, e.g. waves/fi_glaccount.json. Empty verifies every wave in the commit.'
        required: false
        default: ''

# Two clicks on the same sha make the first run obsolete.
concurrency:
  group: verify-${{ inputs.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Require sha
        run: |
          if [ -z "${{ inputs.sha }}" ]; then
            echo "::error title=Missing sha::Verify a specific commit, not the branch tip"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Resolve manifests
        id: changed
        run: |
          WAVE="${{ inputs.wave }}"
          if [ -n "$WAVE" ]; then
            if [ ! -f "$WAVE" ]; then
              echo "::error title=Missing manifest::$WAVE is not in this commit"
              exit 1
            fi
            FILES="$WAVE"
          else
            FILES="$(ls waves/*.json 2>/dev/null || true)"
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Waves to verify:"; echo "${FILES:-（none)}"

      - name: Verify
        if: steps.changed.outputs.files != ''
        run: |
          set -o pipefail
          STATUS=0
          # Each wave is verified separately so the log says which one failed,
          # and one bad wave does not mask the others.
          while IFS= read -r manifest; do
            [ -z "$manifest" ] && continue
            echo "::group::$manifest"
            python ci/verify.py "$manifest" || STATUS=1
            echo "::endgroup::"
          done <<< "${{ steps.changed.outputs.files }}"
          exit $STATUS

      - name: Extra checks from current dev
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          sparse-checkout: |
            ci/extra.yml
            ci/run_extra.py
          sparse-checkout-cone-mode: false
          path: .ci-extra

      - name: Extra checks
        if: steps.changed.outputs.files != ''
        run: |
          set -o pipefail
          EXTRA_YML=".ci-extra/ci/extra.yml"
          EXTRA_PY=".ci-extra/ci/run_extra.py"
          if [ ! -f "$EXTRA_PY" ] && [ -f ci/run_extra.py ]; then
            EXTRA_PY="ci/run_extra.py"
          fi
          if [ ! -f "$EXTRA_YML" ]; then
            echo "No extra checks on this branch — pack only"
            exit 0
          fi
          if [ ! -f "$EXTRA_PY" ]; then
            echo "::warning::ci/run_extra.py missing; skip extra checks"
            exit 0
          fi
          STATUS=0
          while IFS= read -r manifest; do
            [ -z "$manifest" ] && continue
            echo "::group::extra $manifest"
            python "$EXTRA_PY" "$EXTRA_YML" "$manifest" || STATUS=1
            echo "::endgroup::"
          done <<< "${{ steps.changed.outputs.files }}"
          exit $STATUS

      - name: Report review status
        if: always() && steps.changed.outputs.files != ''
        run: |
          # Advisory here, enforced in deploy.yml. Surfacing it on every run
          # means the gap between "tests pass" and "a human approved it" is
          # visible before someone opens the CD page expecting it to sail
          # through.
          while IFS= read -r manifest; do
            [ -z "$manifest" ] && continue
            python - "$manifest" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          n, ok = m.get("itemCount", 0), m.get("approvedCount", 0)
          state = "all approved" if m.get("allApproved") else f"{ok}/{n} approved in the tool"
          print(f"::notice title=Review::{m.get('name', m.get('waveId'))}: {state}")
          PY
          done <<< "${{ steps.changed.outputs.files }}"
